<style type="text/css">
:root {
  --main-blue: #4587b3;
  --main-light-blue: #9cc0d9;
  --main-yellow: #ffd750;
}
a {
  text-decoration: none;
  color: black;
}
a:visited, a:active, a:hover {
  color: black;
}
*, *::before, *::after {
  box-sizing: border-box;
}
body {
  padding: 0;
  margin: 0;
  min-height: 100vh;
  background-color: var(--main-blue);
}

.header {
  height: clamp(40px, 8vw, 100px);
  background-color: var(--main-yellow);
}

.hero {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(16px, 4vw, 64px);
  padding: clamp(16px, 3vw, 32px) 16px;
  background-color: var(--main-light-blue);
  border-top: 3px solid black;
  border-bottom: 3px solid black;
}
.pyowa {
  flex: 0 0 auto;
}
.pyowa img {
  display: block;
  height: clamp(160px, 22vw, 288px);
  width: auto;
}

#meeting {
  flex: 0 1 auto;
  font-family: "Francois One", sans-serif;
  font-weight: 400;
  font-size: clamp(28px, 5.5vw, 80px);
  line-height: 1.15;
  text-align: center;
  color: white;
  text-shadow: -2px 0 black, 0 3px black, 3px 0 black, 0 -2px black;
  font-style: normal;
  overflow-wrap: break-word;
}

.links {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  gap: clamp(20px, 4vw, 56px);
  max-width: 1300px;
  margin: 0 auto;
  padding: clamp(24px, 5vw, 80px) 16px;
}
.links .button {
  border-radius: 50px;
  padding: 10px 20px;
  min-height: 64px;
  border: 3px solid black;
  background-color: white;
  font-family: "Francois One", sans-serif;
  font-weight: bold;
  font-size: clamp(28px, 3.2vw, 50px);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}
.links .button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 0 black;
}
.links .button:focus-visible {
  outline: 4px solid var(--main-yellow);
  outline-offset: 4px;
}

.button img {
  height: 1em;
  width: auto;
  padding-right: 10px;
}

/* Phones: stack the logo above the meeting text */
@media (max-width: 640px) {
  .hero {
    flex-direction: column;
  }
  .pyowa img {
    height: 140px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .links .button {
    transition: none;
  }
}


</style>
<title>Pyowa - The Iowa Python Users Group</title>

<script>
  
  function getFourthTuesday(currentDate = new Date()) {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const dayOfWeek = firstDay.getDay();

      const daysToFirstTuesday = (9 - dayOfWeek) % 7;
      const fourthTuesday = new Date(year, month, 1 + daysToFirstTuesday + 7 * 3);

      if (fourthTuesday.getFullYear() == 2025) {
        if (fourthTuesday.getMonth() == 11){
          currentDate.setDate(1);
          currentDate.setMonth(0);
          currentDate.setYear(2026);
          return getFourthTuesday(currentDate);

        }
      }

      if (fourthTuesday.getMonth() === currentDate.getMonth() && fourthTuesday.getDate() < currentDate.getDate()) {
        currentDate.setDate(1);
        currentDate.setMonth(currentDate.getMonth() + 1)
        return getFourthTuesday(currentDate);
      }

      return fourthTuesday;
  }

    testGetFourthTuesday(2023, 12, 30, "2024-01-23");

  function testGetFourthTuesday(year, month, day, expectedDate) {
      const testDate = new Date(year, month - 1, day);
      const result = getFourthTuesday(testDate);
      const resultStr = result.toISOString().split('T')[0];
      const passed = resultStr === expectedDate;
      console.log(
        `${passed ? "✅" : "❌"} Test for ${year}-${month.toString().padStart(2, '0')}-${day}: Expected ${expectedDate}, Got ${resultStr}`
      );
